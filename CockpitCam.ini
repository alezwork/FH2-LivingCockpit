; CockpitCam.dll -- the living cockpit camera for Forza Horizon 2 (on Azimuth). Read when the game starts.
; The driver's head reacts to the car: it looks into turns, leans and is pushed to the outside by the sideways
; g-forces, dips forward under braking and sinks back under throttle, rides the bumps and kerbs, and shakes a little
; at speed. Only the cockpit camera; the others stay the game's own.

[Camera]
; 1 on, 0 off -- the same as "Living camera" in the game's HUD settings (it switches at once)
Enabled=1
; looking into turns: degrees at 1 g sideways (if it looks out of the turns instead, make it negative)
LookIntoTurns=14
; leaning: the horizon tilting and the head pushed to the outside in turns, percent
Lean=160
; braking and throttle: how much deeper than the game's own the dip and the push back are, percent (0 = the game's)
Pitch=160
; the bumps and kerbs, percent of the game's own
Bumps=200
; a light shake growing with speed, percent (0 = none)
Shake=90
; (the amounts are read at the game's start; the switch works at once)
