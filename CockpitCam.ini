; CockpitCam.dll -- a living cockpit camera for Forza Horizon 2 (on Azimuth). Read when the game starts.
; The driver's head looks into turns, leans and is pushed to the outside by the sideways g-forces, looks
; where the car goes in a slide, dips forward under braking and sinks back under throttle, nods at gear changes, rides
; the bumps and kerbs, shakes a little at speed. (A wider view at speed: SpeedFX.dll.)
; "Living camera" in the game's HUD settings switches it on and off at once.

[Camera]
; 1 on, 0 off -- the same as "Living camera" in the game's HUD settings (it switches at once)
Enabled=1
; the cockpit's field of view, degrees: more = a wider, farther view (the game's own: 48; 0 = the game's)
FieldOfView=65
; looking into turns: degrees in a hard turn (if it looks out of the turns instead, make it negative)
LookIntoTurns=14
; the dead zone of looking into turns: percent of a hard turn below which the head stays straight (0..80)
TurnDeadzone=15
; leaning: the horizon tilting and the head pushed to the outside in turns, percent
Lean=160
; braking and throttle: how much deeper than the game's own the dip and the push back are, percent (0 = the game's)
Pitch=160
; the bumps and kerbs, percent of the game's own
Bumps=200
; a light shake growing with speed, percent (0 = none)
Shake=90
; in a slide: degrees the head turns towards where the car goes (negative if it turns the other way; 0 = none)
SlideLook=10
; the nod at gear changes, percent (0 = none)
GearKick=100
; (the amounts are read at the game's start; the switch works at once)
