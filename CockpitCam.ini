; CockpitCam.dll -- living cameras for Forza Horizon 2 (on Azimuth). Read when the game starts.
; The cockpit: the driver's head looks into turns, leans and is pushed to the outside by the sideways g-forces, looks
; where the car goes in a slide, dips forward under braking and sinks back under throttle, nods at gear changes, rides
; the bumps and kerbs, shakes a little and sees wider at speed.
; The chase cameras: they swing out of turns and turn into them (the corner comes into view), bank, swing round with a
; slide, fall behind under throttle and close in under braking, get lower, farther and wider at speed, shake at speed.
; "Living camera" in the game's HUD settings switches all of it on and off at once.

[Camera]
; 1 on, 0 off -- the same as "Living camera" in the game's HUD settings (it switches at once)
Enabled=1
; the cockpit's field of view, degrees: more = a wider, farther view (the game's own: 48; 0 = the game's)
FieldOfView=65
; looking into turns: degrees in a hard turn (if it looks out of the turns instead, make it negative)
LookIntoTurns=14
; the dead zone of looking into turns: percent of a hard turn below which the head stays straight (0..80)
TurnDeadzone=15
; leaning: the horizon tilting and the head pushed to the outside in turns, percent
Lean=160
; braking and throttle: how much deeper than the game's own the dip and the push back are, percent (0 = the game's)
Pitch=160
; the bumps and kerbs, percent of the game's own
Bumps=200
; a light shake growing with speed, percent (0 = none)
Shake=90
; in a slide: degrees the head turns towards where the car goes (negative if it turns the other way; 0 = none)
SlideLook=10
; degrees the view widens at speed (from 60 mph, full at 160; 0 = none)
SpeedFieldOfView=6
; the nod at gear changes, percent (0 = none)
GearKick=100

[ChaseCamera]
; the cameras behind the car alive too: 1 on, 0 = the game's own
Enabled=1
; swinging out of turns: percent (100 = 1 m, the high camera 1.3 m)
Swing=100
; turning into the turns: degrees in a hard turn (negative if it turns away)
LookIntoTurns=10
; the dead zone: percent of a hard turn below which it stays behind the car (0..80)
TurnDeadzone=10
; banking in turns: degrees (negative for the other way; 0 = none)
Bank=3
; in a slide: degrees it swings round with the car (negative for the other way; 0 = none)
SlideSwing=14
; how softly it follows: percent (more = a longer lag)
Lag=100
; throttle and braking: the car pulling away (0.6 m) and the camera closing in (0.45 m), percent (0 = the game's own)
Surge=100
; speed: from 80 mph, full at 180, the view 7 degrees wider, the camera lower and 0.3 m farther back, percent (0 = none)
SpeedRush=100
; the shake at speed, percent (0 = none)
Shake=100
; (the amounts are read at the game's start; the switch works at once)
