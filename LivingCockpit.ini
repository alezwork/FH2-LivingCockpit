; LivingCockpit.dll -- the living cockpit for Forza Horizon 2 (on Azimuth). Read when the game starts.
; In the cockpit view the driver's head looks into turns, leans and is pushed to the outside by the sideways g-forces,
; looks where the car goes in a slide, dips forward under braking and sinks back under throttle, nods at gear changes,
; rides the bumps and kerbs; and the speed is felt: a wider view, darker edges, a shake from the air, the view opening
; under throttle. The other views stay the game's own.
; In the game's HUD settings: "Living camera" switches all of it on and off, "Motion blur" the game's motion blur in
; every view -- both at once.

[Camera]
; 1 on, 0 off -- the same as "Living camera" in the game's HUD settings (the head and the speed together)
Enabled=1
; the game's motion blur, in every view: 1 on (the game's own), 0 off -- the same as "Motion blur" in the HUD settings
MotionBlur=1
; the cockpit's field of view, degrees: more = a wider, farther view (the game's own: 48; 0 = the game's;
; with ExtraOptions its "FOV - Driver" slider in the HUD settings is used instead)
FieldOfView=65
; looking into turns: degrees in a hard turn (if it looks out of the turns instead, make it negative)
LookIntoTurns=14
; the dead zone of looking into turns: percent of a hard turn below which the head stays straight (0..80)
TurnDeadzone=15
; leaning: the horizon tilting and the head pushed to the outside in turns, percent
Lean=160
; braking and throttle: how much deeper than the game's own the dip and the push back are, percent (0 = the game's)
Pitch=160
; the bumps and kerbs, percent of the game's own
Bumps=200
; a light shake growing with speed, percent (0 = none)
Shake=90
; in a slide: degrees the head turns towards where the car goes (negative if it turns the other way; 0 = none)
SlideLook=10
; the nod at gear changes, percent (0 = none)
GearKick=100

[Speed]
; the speed the effects start from, and the speed they are full at, km/h
From=90
Full=260
; the view wider at full speed, degrees (0 = none)
FieldOfView=12
; darker edges at full speed, percent (0 = none)
Vignette=130
; a fine shake from the air, percent (0 = none)
WindShake=130
; the thrust: the view opening under throttle (5 degrees at 100) and closing under braking (3), percent (0 = none)
Thrust=100
; (the amounts are read at the game's start; the switches work at once)
